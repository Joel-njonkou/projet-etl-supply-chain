version: '3.0'

services:
  db:
    image: postgres:15-alpine
    container_name: supply_db
    environment:
      POSTGRES_DB: supply
      POSTGRES_USER: mnz-supply
      POSTGRES_PASSWORD: supply_chain-NZM
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnz-supply -d supply"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: